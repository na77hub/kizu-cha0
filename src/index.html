<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kizu-cha0</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      body {
        font-family: sans-serif;
        max-width: 40rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      #preferences-push-hint,
      #preferences-status {
        font-size: 0.85rem;
        color: #b00020;
      }
      #preferences-status {
        min-height: 1.2rem;
      }
      #preferences-fields label {
        margin-right: 1rem;
      }
      #keyword-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        list-style: none;
        padding: 0;
      }
      #chat-messages {
        list-style: none;
        padding: 0;
        height: 50vh;
        overflow-y: auto;
        border: 1px solid #ccc;
      }
      #chat-messages li {
        padding: 0.25rem 0.5rem;
      }
      #chat-messages li.mine {
        background: #eef6ff;
      }
      .chat-meta {
        font-size: 0.8rem;
        color: #666;
      }
      .chat-name {
        font-weight: bold;
      }
      .chat-body {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #chat-form {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      #chat-body {
        flex: 1;
      }
      #chat-status {
        min-height: 1.2rem;
        font-size: 0.85rem;
        color: #b00020;
      }
    </style>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <h1>kizu-cha ZERO</h1>
    <div id="room-label"></div>
    <div id="push-status"></div>
    <button id="subscribe-button">購読</button>
    <button id="unsubscribe-button">購読解除</button>

    <h2>通知の受け方</h2>
    <p id="preferences-push-hint" hidden>通知を受けるには購読が必要です。</p>
    <div id="preferences-saved">読み込み中...</div>
    <fieldset id="preferences-fields" disabled>
      <label><input type="radio" name="notification-mode" value="all" checked /> すべて通知</label>
      <label><input type="radio" name="notification-mode" value="keywords" /> キーワードのみ</label>
      <ul id="keyword-list"></ul>
      <form id="keyword-form">
        <input
          id="keyword-input"
          type="text"
          maxlength="30"
          placeholder="キーワード"
          autocomplete="off"
        />
        <button type="submit">追加</button>
      </form>
      <p class="chat-meta">部分一致のため、「AI」は「mail」にも一致します。</p>
      <button id="preferences-save" type="button">保存</button>
    </fieldset>
    <div id="preferences-status" role="status"></div>

    <h2>チャット</h2>
    <ul id="chat-messages"></ul>
    <div id="chat-status"></div>
    <form id="chat-form">
      <input id="chat-name" type="text" maxlength="20" placeholder="表示名" size="10" required />
      <input
        id="chat-body"
        type="text"
        maxlength="500"
        placeholder="メッセージ"
        autocomplete="off"
        required
      />
      <button id="chat-send" type="submit">送信</button>
    </form>
  </body>
</html>
